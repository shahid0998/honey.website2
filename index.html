<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIETRUS Honey</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #000000;
      color: #ffcc00;
      margin: 0; 
      overflow-x: hidden; 
    }
    .navbar-custom {
      background-color: #1a1a1a;
      border-bottom: 2px solid #ffcc00;
      box-shadow: 0 0 10px #ffcc00;
      padding: 0.5rem 1rem;
      z-index: 1000; 
    }
    .navbar-custom .nav-link {
      color: #ffcc00;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .navbar-custom .nav-link:hover {
      color: #ffff00;
      text-shadow: 0 0 5px #ffff00;
    }
    .navbar-brand img {
      height: 50px;
      width: auto;
      filter: drop-shadow(0 0 5px #ffcc00);
      transition: transform 0.3s, filter 0.3s;
    }
    .navbar-brand img:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 8px #ffff00);
    }
    .hero-section {
      position: relative; 
      width: 100%;
      height: 90vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffcc00;
      text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffff00;
    }
    .hero-section h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }
    .hero-section p {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 40px;
      max-width: 700px;
      padding: 0 20px;
      text-shadow: 0 0 5px #ffff00;
    }
    .btn-primary {
      background-color: #ffcc00;
      border: 2px solid #000000;
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      padding: 12px 40px;
      font-size: 1.3rem;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #ffff00;
      border-color: #ffcc00;
      color: #000000;
      box-shadow: 0 0 15px #ffcc00;
    }
    spline-viewer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; 
    }
    @media (max-width: 767.98px) {
      .hero-section h1 {
        font-size: 3rem;
      }
      .hero-section p {
        font-size: 1.2rem;
      }
      .navbar-brand img {
        height: 40px;
      }
      .btn-primary {
        padding: 10px 30px;
        font-size: 1.1rem;
      }
    }
  </style>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.87/build/spline-viewer.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#home">
        <img src="/logo 2-modified.png" alt="DIETRUS Cyberpunk Logo">
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active text-info" href="#home">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="content.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="hero-section">
    <spline-viewer url="https://prod.spline.design/oJzcpPMAtg7hRtOn/scene.splinecode"></spline-viewer>
    <div class="container text-center">
      <h1>WELCOME TO DIETRUS Honey</h1>
      <p><b>Pure Honey from the  Valleys of KASHMIR</b></p>
      <a href="products.html" class="btn btn-primary btn-lg"> Our Products</a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
